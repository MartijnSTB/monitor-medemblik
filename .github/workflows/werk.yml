name: Werkplek verzamelen
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'   # elke ochtend rond 06:41 (zomertijd) / 05:41 (wintertijd)
permissions:
  contents: write
# Zelfde groep als de monitor: nooit tegelijk opslaan.
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  werk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python werk.py
      - name: Bewaar resultaten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/werk.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Werkplek update"
          for poging in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort; sleep 5; }
          done
