
name: Publiceer dashboard

on:
  workflow_run:
    workflows: ["Monitor publicaties"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Niet afbreken als er een nieuwere run komt: een afgebroken publicatie blijft bij GitHub 'bezig' staan
# en dan mislukt de volgende ('due to in progress deployment'). Nu wacht de nieuwe netjes op de vorige;
# GitHub houdt maar één wachtende over, dus er stapelt niets op.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}

    steps:
      - name: Haal nieuwste bestanden op
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bouw de website (dashboard, zoekindex, teksten)
        run: |
          pip install -r requirements.txt
          python build_site.py

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub ziet het geüploade pakket soms net te laat ('No artifacts named github-pages were found').
      # Dan niet meteen mislukken, maar na 30 seconden nog één keer proberen.
      - name: Publiceer website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Even wachten (alleen als publiceren mislukte)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Publiceer website (tweede poging)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
