
name: Publiceer dashboard

on:
  workflow_run:
    workflows: ["Monitor publicaties", "Werkplek verzamelen"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Haal nieuwste bestanden op
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bouw de website (dashboard, zoekindex, teksten)
        run: |
          pip install -r requirements.txt
          python build_site.py

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
